[project]
name = "personio-hacking"
version = "0.2.0"
description = "Automate attendance tracking in Personio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.44.0",
    "pyyaml>=6.0",
]

[project.scripts]
ptrack = "personio_hacking.cli:main"
personio-track = "personio_hacking.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personio_hacking"]

[dependency-groups]
dev = [
    "mypy>=1.10.1",
    "pyrefly>=1.2.0",
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[tool.ruff.lint]
ignore = ["DTZ011"]


